<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather Today</title>
    <link
      rel="icon"
      type="image/x-icon"
      href="../Weather check/pic asset/title pic.png"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="../Weather check/public/script.js" defer></script>
  </head>
  <body>
    <h1>Weather Report Live</h1>
    <h3>
      <input type="text" id="cityInput" placeholder="Enter City Name" />
    </h3>
    <h3>
      <input type="time" name="displayTime" id="userTime" />
    </h3>

    <button id="getWeather">Get Weather</button>

    <h3 id="stats">Current Stats</h3>
    <ul class="reportDetails">
      <p id="cityLabel">City : NA</p>
      <p id="temp">Temperature : NA</p>
      <p id="Humidity">Humidity : NA</p>
      <p id="rain">Rain : NA</p>
      <p id="windSpeed">Wind Speed : NA</p>
    </ul>
    <footer>Version 1.0 In Development</footer>
  </body>
</html>
